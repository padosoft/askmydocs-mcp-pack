name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        dependencies: [lowest, latest]

    name: PHP ${{ matrix.php }} • Laravel ${{ matrix.laravel }} • ${{ matrix.dependencies }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, sqlite, pdo_sqlite, json
          coverage: none

      - name: Resolve dependency matrix
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" --no-update --no-interaction
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress
          else
            composer update --prefer-dist --no-interaction --no-progress
          fi

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always

  quality:
    runs-on: ubuntu-latest
    name: Static analysis, style and OpenAPI
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, sqlite, pdo_sqlite, json, fileinfo
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Validate Composer and OpenAPI
        run: |
          composer validate --strict
          php -r '$s=json_decode(file_get_contents("resources/openapi/v2.json"), true, 512, JSON_THROW_ON_ERROR); if (($s["openapi"] ?? null) !== "3.1.0") exit(1);'
      - name: PHP syntax check
        run: find src database tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPStan
        run: composer analyse
      - name: Pint check
        run: |
          composer format:check
          vendor/bin/pint --test src/Transports/LegacySseJsonRpcTransport.php tests/Feature/Transports/LegacySseJsonRpcTransportTest.php

  conformance:
    runs-on: ubuntu-latest
    name: MCP 2026-07-28 conformance fixtures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, sqlite, pdo_sqlite, json, fileinfo
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit --colors=always tests/Feature/V2 tests/Unit/V2
      - name: MCP Inspector 2.2 transport probe
        run: |
          npx -y @modelcontextprotocol/inspector@2.2.0 --cli php tests/Fixtures/conformance-server.php --method tools/list 2>&1 | tee /tmp/mcp-inspector-probe.log
          grep -F 'Every MCP 2026-07-28 request requires params._meta.' /tmp/mcp-inspector-probe.log
      - name: MCP 2026-07-28 positive stdio end-to-end
        run: vendor/bin/phpunit --colors=always tests/Feature/V2/StdioConformanceProcessTest.php
      - name: Record normative pins
        run: |
          echo 'core=594754559cc928eae08e184c74a89508c1235fc2'
          echo 'apps=10195ad91851502134930e9b80ec2c04e277a720'
          echo 'tasks=2c1425d9a288b9b1f489430fe1e00bb392b47e48'
